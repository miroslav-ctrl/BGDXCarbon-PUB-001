name: Publisher Suite Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check release identity
        shell: python
        run: |
          import os
          import pathlib
          import tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['GITHUB_REF_NAME'] == f'v{version}'
      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build --outdir dist-release
      - name: Generate SHA-256 checksums
        shell: python
        run: |
          import hashlib
          import pathlib
          root = pathlib.Path('dist-release')
          files = sorted(root.glob('*'))
          lines = [f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in files]
          (root / 'SHA256SUMS.txt').write_text(''.join(lines), encoding='utf-8')
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist-release/*.whl dist-release/*.tar.gz dist-release/SHA256SUMS.txt
          --verify-tag --title "BGDXCarbon Publisher Suite $GITHUB_REF_NAME"
          --notes-file RELEASE-NOTES.md
