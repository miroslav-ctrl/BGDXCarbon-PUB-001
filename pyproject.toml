[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "bgdxpublisher"
version = "0.1.0"
description = "Enterprise Publisher Suite runtime foundation"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.5,<3",
    "PyYAML>=6.0.3,<7",
]

[project.scripts]
bgdxpublisher = "bgdxpublisher.cli.app:main"

[project.optional-dependencies]
dev = [
    "black>=26.10.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
strict = true
ignore_missing_imports = true
